# LSP – Docker Compose (sichere Produktions-Defaults)
#
# Lokale Entwicklung:
#   cp docker-compose.override.example.yml docker-compose.override.yml
# (öffnet DB-/Redis-/Gotenberg-Ports auf localhost und aktiviert Debug —
#  docker-compose.override.yml ist gitignored und gehört NICHT auf Produktions-Hosts).

services:
  web:
    image: caddy:2
    restart: unless-stopped
    ports:
      # Hinter externem Reverse-Proxy (z. B. Nginx Proxy Manager) reicht HTTP.
      # Port per Firewall nur für den Proxy freigeben.
      - "${LSP_HTTP_BIND:-0.0.0.0}:${LSP_HTTP_PORT:-8080}:80"
      # Nur mit LSP_CADDYFILE=Caddyfile.tls relevant (Caddy terminiert TLS selbst)
      - "${LSP_HTTP_BIND:-0.0.0.0}:${LSP_HTTPS_PORT:-8443}:443"
    environment:
      LSP_HOSTNAME: ${LSP_HOSTNAME:-localhost}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-admin@example.com}
      LSP_TRUSTED_PROXIES: ${LSP_CADDY_TRUSTED_PROXIES:-private_ranges}
    volumes:
      - ./infra/${LSP_CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./public:/var/www/html/public:ro
    depends_on:
      - app
    networks: [lsp]

  app:
    build:
      context: .
      dockerfile: infra/app/Dockerfile
    image: lsp/app:dev
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-lsp}
      DB_USERNAME: ${DB_USERNAME:-lsp}
      DB_PASSWORD: ${DB_PASSWORD:-lsp_dev}
      REDIS_HOST: cache
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      GOTENBERG_URL: http://pdf:3000
      LSP_AUTO_MIGRATE: ${LSP_AUTO_MIGRATE:-false}
      # Reverse-Proxy — auch ohne .env im Checkout (z. B. Portainer-Git-Stack) wirksam
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-}
    volumes:
      # Bind-Mount des Repos. Public + Storage liegen im Repo —
      # so werden Caddy + PHP-FPM mit demselben Inhalt versorgt und
      # laufen ohne extra Volume-Init durch.
      - ./:/var/www/html
    depends_on:
      db: { condition: service_healthy }
      cache: { condition: service_started }
    networks: [lsp]

  queue:
    image: lsp/app:dev
    restart: unless-stopped
    command: php artisan queue:work --queue=high,default,pdf,mail,backup --tries=3 --timeout=120
    environment: &app_env
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-lsp}
      DB_USERNAME: ${DB_USERNAME:-lsp}
      DB_PASSWORD: ${DB_PASSWORD:-lsp_dev}
      REDIS_HOST: cache
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      GOTENBERG_URL: http://pdf:3000
      LSP_AUTO_MIGRATE: ${LSP_AUTO_MIGRATE:-false}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-}
    volumes:
      - ./:/var/www/html
    depends_on: [app]
    networks: [lsp]

  scheduler:
    image: lsp/app:dev
    restart: unless-stopped
    # Führt u. a. das tägliche backup:run aus (siehe routes/console.php)
    command: ["sh","-c","while true; do php artisan schedule:run --no-interaction; sleep 60; done"]
    environment: *app_env
    volumes:
      - ./:/var/www/html
    depends_on: [app]
    networks: [lsp]

  pdf:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    command:
      - "gotenberg"
      - "--api-port=3000"
      - "--api-timeout=60s"
      - "--chromium-disable-javascript=false"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [lsp]

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-lsp}
      MARIADB_USER: ${DB_USERNAME:-lsp}
      MARIADB_PASSWORD: ${DB_PASSWORD:-lsp_dev}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-lsp_root_dev}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [lsp]

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    # Mit REDIS_PASSWORD (≠ leer/"null") startet Redis mit requirepass
    command: ["sh", "-c", "if [ -n \"$$REDIS_PASSWORD\" ] && [ \"$$REDIS_PASSWORD\" != null ]; then exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\"; else exec redis-server --appendonly yes; fi"]
    volumes:
      - cache_data:/data
    networks: [lsp]

volumes:
  caddy_data:
  caddy_config:
  db_data:
  cache_data:

networks:
  lsp:
    driver: bridge

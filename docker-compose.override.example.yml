# Lokale Entwicklung — NICHT auf Produktions-Hosts verwenden.
#
#   cp docker-compose.override.example.yml docker-compose.override.yml
#
# docker-compose.override.yml ist gitignored und wird von `docker compose`
# automatisch geladen. Ports binden bewusst nur an localhost.

services:
  app:
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      LOG_LEVEL: debug

  db:
    ports:
      - "127.0.0.1:33060:3306"   # Optional: für externes DB-Tool

  cache:
    ports:
      - "127.0.0.1:63790:6379"

  pdf:
    ports:
      - "127.0.0.1:3001:3000"

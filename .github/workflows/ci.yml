name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Verhindert mehrere parallele Runs auf demselben Branch — sparsam mit GHA-Minuten.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code-Style + Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, sodium, openssl, mbstring, intl
          tools: composer:v2
          coverage: none

      - name: Composer cache
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --no-interaction

      - name: Pint (Code-Style)
        run: vendor/bin/pint --test

      - name: PHPStan (Static Analysis)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  tests:
    name: PHPUnit (Unit + Feature)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, sodium, openssl, mbstring, intl
          tools: composer:v2
          coverage: none

      - name: Composer cache
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --no-interaction

      - name: Prepare app
        run: |
          cp .env.example .env || true
          php artisan key:generate --ansi || true

      - name: Run PHPUnit
        run: vendor/bin/phpunit --no-coverage
